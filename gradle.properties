# ===== Gradle 自身配置 =====
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ===== 如果你的网络需要走本地代理（IDEA 能联网但 Gradle 报 Connect timed out 时）=====
# 把下面 5 行的 # 去掉，端口换成你自己代理软件的 HTTP 端口。
# （本机检测到系统代理是 127.0.0.1:11958，可用 netstat -ano | findstr LISTENING 确认）
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=11958
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=11958
#systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]

# ===== 环境版本 =====
# Minecraft 版本
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# NeoForge 版本（你指定的 21.1.259）
neo_version=21.1.259
neo_version_range=[21.1.0,)
# FML loader 版本范围
loader_version_range=[4,)

# ===== Mod 元信息 =====
mod_id=trampleguard
mod_name=Trample Guard
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example.trampleguard
mod_authors=KHomo
mod_description=Prevents mobs and players from trampling farmland, so your crops are never destroyed.
